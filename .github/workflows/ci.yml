name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src app tests
      - name: Testes
        run: pytest -q
