[project]
name = "radar-dengue"
version = "0.1.0"
description = "Previsão semanal de casos de dengue nos municípios de São Paulo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "streamlit>=1.40",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
analise = ["statsmodels>=0.14", "matplotlib>=3.8", "jupyter>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
